name: sebel-hakim
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.3
      - torchvision>=0.18
      - timm>=1.0.9
      - pyyaml
      - pillow
      - numpy
      - onnx
      - onnxscript
      - onnxruntime
      - datasets            # only for Hugging Face parquet datasets
      - huggingface_hub
      - kaggle              # only for Kaggle datasets
